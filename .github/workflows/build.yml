name: Build Qt Context Menu Accessibility Test

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Qt Application
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Qt 6.7.3
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.7.3
          arch: win64_msvc2022_64
          modules: ""
          cache: true

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare artifact
        shell: pwsh
        run: |
          mkdir artifact
          copy build\Release\QtContextMenuAccessibilityTest.exe artifact\

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: QtContextMenuAccessibilityTest-Windows
          path: artifact